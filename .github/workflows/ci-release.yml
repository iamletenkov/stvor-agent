name: CI and Release

# Проверки — те же make-цели, что запускают руками: make ci (lint с actionlint
# и сверкой образцов контракта, test, build-all, deb, repro-check), make vuln,
# make test-integration, make e2e (на main и вручную), make e2e-openwrt. Go, nfpm,
# линтеры — в контейнерах с закреплёнными образами (Makefile), CI и локальный
# прогон не расходятся.
#
# Выпуск — release-please (release-type: go, конфиг .github/release_please/):
# на main после зелёных проверок он ведёт PR «release X.Y.Z» (CHANGELOG.md);
# слияние этого PR создаёт тег vX.Y.Z и опубликованный релиз. Теги руками не
# ставят. Версия в бинаре и пакете — из тега (ldflags), CI сверяет.
# Затем release-artifacts собирает из тега оба .deb, оба tar.gz для OpenWrt
# (stvor-agent_<v>_linux_<arch>.tar.gz) и общий SHA256SUMS и прикладывает
# их к релизу, а dispatch-extensions (если включён переменной
# EXTENSIONS_BUMP_ENABLED) запускает в cream-extensions подъём пина агента.
#
# Ручной запуск (Actions → CI and Release → Run workflow): без tag — проверки
# на выбранной ветке; с tag — ещё и сборка ассетов этого тега (сухой прогон),
# а с upload=true — загрузка их в опубликованный релиз (--clobber) и dispatch.

# Ветки проверяются на pull_request, push — только main: там релиз. Ветку без
# PR — черновым PR или вручную (workflow_dispatch).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег vX.Y.Z (4.x и новее): собрать ассеты релиза (пусто — только проверки)"
        required: false
        default: ""
        type: string
      upload:
        description: "Загрузить ассеты в опубликованный релиз тега и запустить подъём пина (иначе сухой прогон)"
        required: false
        default: false
        type: boolean

# Права — на уровне job, по минимуму; по умолчанию нет никаких.
permissions: {}

# Отменять устаревший прогон можно только на PR: на main отмена посреди
# релизной цепочки оставила бы опубликованный релиз без файлов.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tag || 'checks' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (make ci)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Соседняя копия cream-extensions для сверки файлов-образцов контракта
      # (tools/check-contract-fixtures.sh, план Task 19). Ветка — переменная
      # репозитория CE_CONTRACT_REF: до слияния пилота CE в main —
      # feature/cream-v1-pilot (умолчание), затем main.
      CREAM_EXTENSIONS_DIR: ${{ github.workspace }}/.cache/cream-extensions
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # SOURCE_DATE_EPOCH — время коммита; теги — для проверки release-as
          persist-credentials: false

      # Секреты в дереве — тот же gitleaks и тот же .gitleaks.toml, что на
      # pre-commit; образ закреплён по версии. До checkout cream-extensions:
      # сканируется только этот репозиторий.
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner -v

      # release-as в конфиге release-please задаёт номер первого Go-выпуска
      # (4.0.0; по одним коммитам feat вышло бы 3.2.0). После выхода этой
      # версии его надо убрать, иначе release-please снова предложит тот же
      # номер: проверка краснеет, как только тег v<release-as> существует.
      - name: release-as не пережил свой релиз
        run: |
          set -euo pipefail
          ra="$(jq -r '.packages["."]["release-as"] // empty' .github/release_please/release-please-config.json)"
          if [ -n "$ra" ] && git rev-parse -q --verify "refs/tags/v$ra" >/dev/null; then
            echo "::error::тег v$ra уже есть — уберите release-as из .github/release_please/release-please-config.json"
            exit 1
          fi
          echo "release-as: ${ra:-нет}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: iamletenkov/cream-extensions
          ref: ${{ vars.CE_CONTRACT_REF || 'feature/cream-v1-pilot' }}
          path: .cache/cream-extensions
          persist-credentials: false

      # CI=true (по умолчанию в Actions): без копии cream-extensions сверка
      # образцов контракта — ошибка, а не пропуск.
      # make ci — ещё и сухой прогон выпуска: те же make deb и
      # tools/check-release-assets.sh, что в release-artifacts, на 0.0.0-dev.
      - name: make ci
        run: make ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 7

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: make vuln
        run: make vuln

  # Адаптер internal/teleport против настоящего cream по пину
  # test/integration/cream-pin.env. Пока cream 1.0.0 не выпущен, пин пуст —
  # цель пропускает прогон строкой «пропуск — пин cream пуст», job зелёный.
  integration:
    name: Integration (cream by pin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: make test-integration
        run: make test-integration

  # Сквозной тест (план Task 20, спека §15.3): контейнер debian:12 с systemd,
  # cream по пину, снимок каталога cream-extensions по пину test/e2e/catalog-pin.env,
  # stvor-agent из dist/. Тяжёлый и зависит от cgroup раннера (риск R9 плана) —
  # не на каждый PR: на main и вручную, по одному; релиз его не ждёт.
  e2e:
    name: E2E (systemd in container)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: e2e
      cancel-in-progress: false
    env:
      CREAM_EXTENSIONS_DIR: ${{ github.workspace }}/.cache/cream-extensions
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Снимок каталога — коммит из пина; содержимое сверяет сам тест (sha256 архива).
      - name: Пин снимка каталога
        id: pin
        run: |
          set -euo pipefail
          line="$(grep -E '^CE_COMMIT=[0-9a-f]{40}$' test/e2e/catalog-pin.env)"
          echo "commit=${line#CE_COMMIT=}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: iamletenkov/cream-extensions
          ref: ${{ steps.pin.outputs.commit }}
          path: .cache/cream-extensions
          persist-credentials: false

      - name: make e2e
        run: make e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-logs
          path: .scratchpad/test-runs/
          if-no-files-found: ignore
          retention-days: 7

  # OpenWrt (спека OpenWrt §4.3): корневая ФС openwrt-builder v0.3.1 в docker,
  # установка из tar.gz выпуска, procd-скрипты через rc.common, телеметрия.
  # Лёгкий (без systemd) — на каждый PR.
  e2e-openwrt:
    name: E2E (OpenWrt root FS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # SOURCE_DATE_EPOCH — время коммита
          persist-credentials: false

      - name: make e2e-openwrt
        run: make e2e-openwrt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-openwrt-logs
          path: .scratchpad/test-runs/
          if-no-files-found: ignore
          retention-days: 7

  release-please:
    name: Release Please
    needs: [check, vuln, integration, e2e-openwrt]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: .github/release_please/release-please-config.json
          manifest-file: .github/release_please/.release-please-manifest.json
          # PAT владельца (RELEASE_PR_TOKEN): PR релиза от GITHUB_TOKEN не запускает
          # CI. Тег и релиз от PAT ничего не запускают — триггеров на теги и
          # релизы нет. Без секрета — GITHUB_TOKEN, как раньше.
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

  # Ассеты релиза: после release-please, создавшего релиз, или вручную по tag.
  # На ручном запуске release-please пропущен — !cancelled() не даёт пропуску
  # снять и этот job. Упала сборка — «Re-run failed jobs» или ручной запуск
  # с tag и upload=true, не откат релиза.
  release-artifacts:
    name: Release assets (.deb, tar.gz, SHA256SUMS)
    needs: release-please
    if: >-
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Один тег — одна сборка за раз; начатую загрузку не отменять.
    concurrency:
      group: release-artifacts-${{ needs.release-please.outputs.tag_name || inputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      UPLOAD: ${{ needs.release-please.outputs.release_created == 'true' || inputs.upload }}
    steps:
      # Только 4.x и новее: ассеты 3.x (пакет *_all.deb прежнего имени)
      # не перевыпускаются (спека §14), а цели make deb на тегах 3.x нет.
      - name: Check tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::тег должен быть vX.Y.Z, получено: '$TAG'"; exit 1; }
          (( BASH_REMATCH[1] >= 4 )) \
            || { echo "::error::$TAG: ассеты 3.x этим workflow не собираются"; exit 1; }
          if [ "$UPLOAD" = true ]; then
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            [ "$draft" = false ] \
              || { echo "::error::релиз $TAG не найден или ещё черновик"; exit 1; }
          fi

      # Собираем ровно тот коммит, на который указывает тег: при ручной
      # пересборке старого релиза HEAD main давно ушёл вперёд.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0   # время коммита тега
          persist-credentials: false

      # Теги до поддержки OpenWrt (нет tools/tarball.sh) этим workflow не
      # пересобираются: их набор ассетов — без tar.gz.
      - name: Тег с tar.gz для OpenWrt
        run: |
          [ -f tools/tarball.sh ] \
            || { echo "::error::$TAG: в теге нет tools/tarball.sh — ассеты до OpenWrt этим workflow не пересобираются"; exit 1; }

      # VERSION — тег без «v», SOURCE_DATE_EPOCH — время коммита тега: те же
      # байты, что у make deb / repro-check локально на этом коммите.
      - name: make deb
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct "refs/tags/$TAG^{commit}")"
          rm -r -f dist
          make deb VERSION="${TAG#v}" SOURCE_DATE_EPOCH="$epoch"

      # Бинарь знает свою версию из ldflags: version --short обязан совпасть
      # с тегом (build-all сверяет то же внутри make, здесь — явно по тегу).
      - name: Verify version and assets
        run: |
          set -euo pipefail
          v="${TAG#v}"
          got="$(dist/stvor-agent-linux-amd64 version --short)"
          [ "$got" = "$v" ] \
            || { echo "::error::version --short = '$got', тег $TAG"; exit 1; }
          tools/check-release-assets.sh "$v" dist
          cd dist
          {
            echo "### Ассеты $TAG"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Сборка воспроизводимая: при пересборке сумма та же, --clobber
      # заменяет файлы тем же содержимым.
      - name: Upload to GitHub Release
        if: env.UPLOAD == 'true'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "stvor-agent_${v}_amd64.deb" "stvor-agent_${v}_arm64.deb" \
            "stvor-agent_${v}_linux_amd64.tar.gz" "stvor-agent_${v}_linux_arm64.tar.gz" SHA256SUMS

  # Релиз поднимает пин агента в cream-extensions: запускает там
  # agent-bump.yml, который берёт SHA256SUMS релиза, ставит версию и суммы
  # в обёртку stvor-agent и открывает PR. Поэтому job идёт после
  # release-artifacts: до загрузки файлов сумм ещё нет.
  #
  # Включается переменной репозитория EXTENSIONS_BUMP_ENABLED=true. Пока
  # перенацеленный agent-bump (план, Task 14) не слит в main cream-extensions,
  # тамошний agent-bump ищет пакет 3.x (*_all.deb прежнего имени) и упадёт,
  # поэтому по умолчанию — предупреждение и пропуск; пин обёртки в пилотной
  # ветке ставится руками tools/agent-bump.sh.
  #
  # Токен — EXTENSIONS_DISPATCH_TOKEN: fine-grained PAT только на
  # iamletenkov/cream-extensions с правом Actions: Read and write. Код он
  # пушить не может — ветку и PR там делает уже GITHUB_TOKEN того workflow.
  # GITHUB_TOKEN этого репозитория чужой workflow запустить не может.
  #
  # Повторный запуск (ручной с tag и upload=true) идемпотентен: пин уже на
  # версии или PR открыт — второго PR нет. Без секрета в форке — пропуск
  # с предупреждением; в iamletenkov/stvor-agent — отказ.
  dispatch-extensions:
    name: Bump agent in cream-extensions
    needs: [release-please, release-artifacts]
    if: >-
      !cancelled() && needs.release-artifacts.result == 'success' && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.upload)
      )
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch agent-bump.yml
        env:
          GH_TOKEN: ${{ secrets.EXTENSIONS_DISPATCH_TOKEN }}
          ENABLED: ${{ vars.EXTENSIONS_BUMP_ENABLED }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          TARGET_REPO: iamletenkov/cream-extensions
          HOME_REPO: iamletenkov/stvor-agent
        run: |
          set -euo pipefail
          if [ "$ENABLED" != true ]; then
            echo "::warning::EXTENSIONS_BUMP_ENABLED не true — подъём пина $TAG в $TARGET_REPO пропущен (руками: tools/agent-bump.sh в cream-extensions)"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег релиза должен иметь вид vX.Y.Z, получено: '$TAG'"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_REPOSITORY" = "$HOME_REPO" ]; then
              echo "::error::Нет секрета EXTENSIONS_DISPATCH_TOKEN — расширения не узнают о $TAG"
              exit 1
            fi
            echo "::warning::Нет секрета EXTENSIONS_DISPATCH_TOKEN — подъём пина пропущен"
            exit 0
          fi
          gh workflow run agent-bump.yml -R "$TARGET_REPO" --ref main -f tag="$TAG"
          echo "Запущен agent-bump.yml в $TARGET_REPO для $TAG"

  # Релиз поднимает пин агента в портале Stvor: запускает там
  # robot-pins-bump.yml (component=stvor-agent), который берёт SHA256SUMS
  # релиза, ставит STVOR_AGENT_VERSION и обе суммы в .env.example и
  # открывает PR. Идёт после release-artifacts: до загрузки файлов сумм нет.
  #
  # Выключатель — переменная репозитория STVOR_BUMP_ENABLED=true. Токен —
  # STVOR_DISPATCH_TOKEN: fine-grained PAT только на iamletenkov/stvor с
  # правом Actions: Read and write. Нет секрета — предупреждение в журнале,
  # job зелёный: релиз агента от портала не зависит. Повтор идемпотентен.
  dispatch-stvor:
    name: Bump agent in stvor
    needs: [release-please, release-artifacts]
    if: >-
      !cancelled() && needs.release-artifacts.result == 'success' && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.upload)
      )
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch robot-pins-bump.yml
        env:
          GH_TOKEN: ${{ secrets.STVOR_DISPATCH_TOKEN }}
          ENABLED: ${{ vars.STVOR_BUMP_ENABLED }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          TARGET_REPO: iamletenkov/stvor
        run: |
          set -euo pipefail
          if [ "$ENABLED" != true ]; then
            echo "::notice::STVOR_BUMP_ENABLED не true — подъём пина $TAG в $TARGET_REPO пропущен"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег релиза должен иметь вид vX.Y.Z, получено: '$TAG'"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Нет секрета STVOR_DISPATCH_TOKEN — подъём пина $TAG в $TARGET_REPO пропущен"
            exit 0
          fi
          gh workflow run robot-pins-bump.yml -R "$TARGET_REPO" --ref main \
            -f component=stvor-agent -f tag="$TAG"
          echo "Запущен robot-pins-bump.yml в $TARGET_REPO для $TAG"
