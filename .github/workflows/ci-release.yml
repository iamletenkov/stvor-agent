name: CI and Release

# shellcheck, тесты на подменённом корне и сборка .deb — та же точка входа
# tools/check.sh, что запускают руками. Пакет собирается воспроизводимо:
# сумма артефакта CI совпадает с суммой локальной сборки того же коммита.
#
# Выпуск — release-please, как в bisquite: на main после проверок он ведёт
# PR «release X.Y.Z» (VERSION и CHANGELOG.md); слияние этого PR создаёт тег
# vX.Y.Z и ОПУБЛИКОВАННЫЙ релиз, после чего job release-artifacts собирает из
# тега .deb и SHA256SUMS и прикладывает их к релизу, а dispatch-extensions
# запускает в cream-extensions подъём пина агента. Теги руками не ставят.
#
# Повторно собрать и приложить файлы к уже опубликованному релизу — ручной
# запуск с входом release_tag (Actions → CI and Release → Run workflow).

# Ветки проверяются на pull_request (результат слияния с main), push — только
# main: там релиз. push во все ветки вместе с pull_request гонял CI дважды на
# каждый коммит PR. Ветку без PR — черновым PR или вручную (workflow_dispatch).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Тег уже опубликованного релиза (например, v3.0.1), к которому
          пересобрать и приложить файлы. Пусто — обычный прогон.
        required: false
        type: string

# По умолчанию — только чтение. Запись получают ровно те job'ы, которым она
# нужна: release-please (релиз, тег, релиз-PR и его метки) и загрузка файлов.
permissions:
  contents: read

# Отменять устаревший прогон можно только на PR: на main отмена посреди
# релизной цепочки оставила бы опубликованный релиз без файлов.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # SOURCE_DATE_EPOCH — время последнего коммита
          persist-credentials: false

      # Секреты в дереве — тот же gitleaks и тот же .gitleaks.toml, что на
      # pre-commit; образ закреплён по версии.
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner -v

      # Go-агент 4.x: те же make-цели, что руками (Go в контейнере
      # golang:1.26.9, линтер закреплён в Makefile). Шаги 3.x ниже остаются,
      # пока bash-агент живёт в репозитории.
      - name: Go lint, test, build
        run: make lint test build-all

      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends shellcheck lintian

      - name: shellcheck and tests
        run: tools/check.sh
        env:
          CI: "1"

      - name: Build .deb
        run: |
          tools/build-deb.sh
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      # Сведения, а не ворота: пакет собран dpkg-deb без debhelper.
      - name: lintian (informational)
        run: lintian --no-tag-display-limit dist/*.deb || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: dist/

  release-please:
    name: Release Please
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: .github/release_please/release-please-config.json
          manifest-file: .github/release_please/.release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Если сборка упала, релиз с тегом уже виден без файлов. Чинится не
  # откатом, а повторной сборкой: «Re-run failed jobs» в том же прогоне либо
  # ручной запуск с release_tag=<тег>.
  release-artifacts:
    name: Attach .deb and SHA256SUMS
    needs: release-please
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
    steps:
      # Ручной запуск обязан указывать на существующий опубликованный релиз:
      # прикладывать файлы к черновику или к опечатке — нельзя.
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::тег '$TAG' не похож на vX.Y.Z"; exit 1; }
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          [[ "$draft" == "false" ]] \
            || { echo "::error::релиз $TAG не найден или ещё черновик"; exit 1; }

      # Собираем ровно тот коммит, на который указывает тег: при ручной
      # пересборке старого релиза HEAD main давно ушёл вперёд.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0   # SOURCE_DATE_EPOCH — время последнего коммита
          persist-credentials: false

      - name: Build .deb and SHA256SUMS
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          file_ver="$(tr -d '[:space:]' < VERSION)"
          [[ "$file_ver" == "$ver" ]] \
            || { echo "::error::тег $TAG, а VERSION=$file_ver"; exit 1; }
          rm -r -f dist
          tools/build-deb.sh
          test -f "dist/bisquite-teleport-agent_${ver}_all.deb"
          (cd dist && sha256sum -c SHA256SUMS)

      # Сборка воспроизводимая: при пересборке сумма та же, --clobber
      # заменяет файлы тем же содержимым.
      - name: Upload files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Релиз сам поднимает пин агента в cream-extensions: запускает там
  # agent-bump.yml, который ставит версию и sha256 из SHA256SUMS релиза
  # в расширение teleport-agent и открывает PR. Поэтому job идёт только
  # после release-artifacts: до загрузки файлов суммы ещё нет.
  #
  # Токен — EXTENSIONS_DISPATCH_TOKEN: fine-grained PAT только на
  # iamletenkov/cream-extensions с правом Actions: Read and write. Код он
  # пушить не может — ветку и PR там делает уже GITHUB_TOKEN того workflow.
  # GITHUB_TOKEN этого репозитория чужой workflow запустить не может.
  #
  # Те же условия, что у release-artifacts: push в main с созданным релизом
  # либо ручная пересборка с release_tag. Пересборка дёргает подъём снова —
  # он идемпотентен (пин уже на версии, PR открыт, релиз старше пина — PR
  # нет), а если первый dispatch не дошёл, это и есть способ повторить.
  # На pull_request секретов нет, а pull_request_target здесь не нужен
  # и опасен. Без секрета (форк, чужой клон) шаг пропускается
  # с предупреждением; в iamletenkov/stvor-agent это отказ.
  dispatch-extensions:
    name: Bump agent in cream-extensions
    needs: [release-please, release-artifacts]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch agent-bump.yml
        env:
          GH_TOKEN: ${{ secrets.EXTENSIONS_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
          TARGET_REPO: iamletenkov/cream-extensions
          HOME_REPO: iamletenkov/stvor-agent
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег релиза должен иметь вид vX.Y.Z, получено: '$TAG'"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_REPOSITORY" = "$HOME_REPO" ]; then
              echo "::error::Нет секрета EXTENSIONS_DISPATCH_TOKEN — расширения не узнают о $TAG"
              exit 1
            fi
            echo "::warning::Нет секрета EXTENSIONS_DISPATCH_TOKEN — подъём пина пропущен"
            exit 0
          fi
          gh workflow run agent-bump.yml -R "$TARGET_REPO" --ref main -f tag="$TAG"
          echo "Запущен agent-bump.yml в $TARGET_REPO для $TAG"
